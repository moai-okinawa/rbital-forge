name: Check static site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check static files
        run: python3 scripts/check-site.py
      - name: Check JavaScript syntax
        run: node --check dist/site.js
      - name: Check interactions
        run: node scripts/test-interactions.cjs
